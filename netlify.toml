[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/shaders/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/schems/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/t-packs/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
